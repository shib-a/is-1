plugins {
  id 'java'
  id 'war'
}

group 'com.is'
version '1.0-SNAPSHOT'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.9.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

dependencies {
  implementation 'org.mapstruct:mapstruct:1.6.3'
  implementation("org.postgresql:postgresql:42.7.8")
  compileOnly('jakarta.platform:jakarta.jakartaee-web-api:9.1.0')
  implementation('org.eclipse.persistence:org.eclipse.persistence.jpa:3.0.2')
  implementation("org.eclipse.persistence:eclipselink:4.0.4")
  compileOnly("org.projectlombok:lombok:1.18.42")
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
  implementation 'com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-json-provider:2.17.2'

  // Annotation processors - order matters! Lombok must come before MapStruct
  annotationProcessor("org.projectlombok:lombok:1.18.42")
  annotationProcessor("org.projectlombok:lombok-mapstruct-binding:0.2.0")
  annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
  compileOnly 'org.jboss.resteasy:resteasy-core:6.2.10.Final'
  compileOnly("org.jboss.resteasy:resteasy-jackson2-provider:6.2.10.Final")
  compileOnly("org.glassfish.jaxb:jaxb-runtime:4.0.5")
  compileOnly("org.glassfish.jaxb:jaxb-xjc:4.0.5")

  testCompileOnly("org.projectlombok:lombok:1.18.42")
  testAnnotationProcessor("org.projectlombok:lombok:1.18.42")

  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
useJUnitPlatform()}